{% include 'admin_navbar.html' %}

<style>


.form-card{
    background:white;
    border:none;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.card-header-custom{
    padding:20px 25px;
    border-bottom:1px solid #f1f5f9;
}

.card-header-custom h4{
    margin:0;
    font-weight:700;
    color:#1e293b;
}

.form-body{
    padding:25px;
}

.form-control{
    border-radius:12px;
    padding:12px;
    border:1px solid #dbe2ea;
}

.form-select{
    border-radius:12px;
    padding:12px;
}

.btn-save{
    background:#4f46e5;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:12px;
    font-weight:600;
}

.btn-save:hover{
    background:#4338ca;
    color:white;
}

.required{
    color:red;
}
</style>

<main id="main" class="main">

    <div class="container-fluid">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card form-card">

                    <div class="card-header-custom">
                        <h4>
                            <i class="bi bi-megaphone-fill text-primary"></i>
                            Add Announcement
                        </h4>
                    </div>

                    <div class="form-body">

                        <form method="POST">

                            {% csrf_token %}

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Title <span class="required">*</span>
                                </label>

                                <input type="text"
                                       name="title"
                                       class="form-control"
                                       placeholder="Enter announcement title"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Announcement Message
                                    <span class="required">*</span>
                                </label>

                                <textarea name="message"
                                          rows="6"
                                          class="form-control"
                                          placeholder="Enter announcement details..."
                                          required></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Priority
                                </label>

                                <select class="form-select"
                                        name="priority">

                                    <option value="Normal">
                                        Normal
                                    </option>

                                    <option value="Important">
                                        Important
                                    </option>

                                    <option value="Urgent">
                                        Urgent
                                    </option>

                                </select>
                            </div>

                            <button class="btn btn-save">
                                <i class="bi bi-check-circle"></i>
                                Publish Announcement
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
