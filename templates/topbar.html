
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<div class="topbar">


<div class="topbar-left">

    <div>
        <h4 class="mb-0 fw-bold">
            Welcome back, {{ bok.First_name }} 👋
        </h4>

        <small class="text-muted">
            Have a productive day at Codexler Technologies
        </small>
    </div>

</div>

<div class="topbar-right">

    <div class="current-time">
        <i class="bi bi-calendar-event"></i>
        <span id="currentDateTime"></span>
    </div>

    <div class="attendance-btn">

        <form method="POST"
              action="{% url 'mark_attendance_staff' %}">
            {% csrf_token %}

            <input type="hidden"
                   name="status"
                   value="Present">

            {% if open_attendance %}

            <button type="submit"
                    class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i>
                Check Out
            </button>

            {% else %}

            <button type="submit"
                    class="btn btn-success">
                <i class="bi bi-box-arrow-in-right"></i>
                Check In
            </button>

            {% endif %}

        </form>

    </div>

    <div class="profile-box">

        <img src="/media/{{ bok.Image }}"
             alt="Profile">

        <div>

            <h6>{{ bok.First_name }}</h6>

            <small>
                Employee ID :
                {{ bok.Emp_Id }}
            </small>

        </div>

    </div>

</div>


</div>

<script>

function updateDateTime() {

    const now = new Date();

    const options = {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    };

    document.getElementById(
        'currentDateTime'
    ).innerHTML =
        now.toLocaleDateString(
            'en-US',
            options
        );
}

setInterval(updateDateTime,1000);

updateDateTime();

</script>
<style>
    .topbar{
height:85px;
background:white;
border-bottom:1px solid #edf2f7;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
position:sticky;
top:0;
z-index:999;
}

.topbar-left h4{
color:#111827;
}

.topbar-right{
display:flex;
align-items:center;
gap:20px;
}

.current-time{
background:#f8fafc;
padding:10px 15px;
border-radius:12px;
font-size:14px;
color:#64748b;
}

.profile-box{
display:flex;
align-items:center;
gap:12px;
background:#f8fafc;
padding:8px 14px;
border-radius:15px;
}

.profile-box img{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
}

.profile-box h6{
margin:0;
font-size:14px;
font-weight:600;
}

.profile-box small{
color:#64748b;
}

.attendance-btn .btn{
border-radius:12px;
padding:10px 18px;
font-weight:600;
}

</style>
